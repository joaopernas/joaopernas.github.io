<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quadro Branco de Formação</title>

    <style>
        :root {
            --cor-fundo: #274956;
            --cor-texto: #ffffff;
            --cor-barra: rgba(255, 255, 255, 0.10);
            --cor-borda: rgba(255, 255, 255, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
        }

        .aplicacao {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 30px;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .simbolo {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            background: #f04b10;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border: 8px solid white;
            box-shadow: 8px 8px 0 rgba(255,255,255,0.25);
        }

        .marca-texto strong {
            display: block;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .marca-texto span {
            font-size: 14px;
            opacity: 0.8;
        }

        .editor {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 6vw 130px;
        }

        #texto {
            width: 100%;
            max-height: 65vh;
            overflow: auto;
            outline: none;
            border: 2px dashed transparent;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            font-size: 66px;
            line-height: 1.15;
            font-weight: 700;
            color: var(--cor-texto);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #texto:focus {
            border-color: rgba(255,255,255,0.30);
            background: rgba(255,255,255,0.03);
        }

        #texto:empty::before {
            content: attr(data-placeholder);
            opacity: 0.38;
        }

        .barra {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: min(940px, calc(100% - 30px));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 14px;
            background: var(--cor-barra);
            border: 1px solid var(--cor-borda);
            border-radius: 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
        }

        .barra button,
        .barra label {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 12px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: transparent;
            font-family: Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
        }

        .barra button:hover,
        .barra label:hover {
            background: rgba(255,255,255,0.14);
        }

        .barra button.ativo {
            background: rgba(255,255,255,0.22);
        }

        .separador {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.18);
        }

        input[type="color"] {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 2px solid white;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        .ajuda {
            position: fixed;
            right: 18px;
            top: 18px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .cabecalho {
                padding: 15px;
            }

            .marca-texto span {
                display: none;
            }

            .editor {
                padding: 15px 15px 175px;
            }

            #texto {
                font-size: 42px;
                padding: 15px;
            }

            .barra {
                bottom: 10px;
                gap: 4px;
                padding: 9px;
                border-radius: 16px;
            }

            .barra button,
            .barra label {
                padding: 8px;
                font-size: 0;
            }

            .barra button span,
            .barra label span {
                font-size: 19px;
            }

            .separador {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="aplicacao">

    <header class="cabecalho">
        <div class="marca">
            <div class="simbolo">↑</div>

            <div class="marca-texto">
                <strong>JOÃO PERNAS</strong>
                <span>Ferramentas de Formação</span>
            </div>
        </div>
    </header>

    <main class="editor">
        <div
            id="texto"
            contenteditable="true"
            spellcheck="true"
            data-placeholder="Clique aqui e escreva com o teclado..."
            aria-label="Área de escrita do quadro branco">
        </div>
    </main>

</div>

<button
    class="ajuda"
    type="button"
    title="Clique no centro do quadro e comece a escrever">
    ?
</button>

<div class="barra">

    <button type="button"
            onclick="diminuirTexto()"
            title="Diminuir texto">
        <span>➖</span> Diminuir
    </button>

    <button type="button"
            onclick="aumentarTexto()"
            title="Aumentar texto">
        <span>➕</span> Aumentar
    </button>

    <div class="separador"></div>

    <button id="botaoNegrito"
            type="button"
            onclick="alternarNegrito()"
            title="Negrito">
        <span>𝐁</span> Negrito
    </button>

    <button type="button"
            onclick="alinhar('left')"
            title="Alinhar à esquerda">
        <span>☰</span> Esquerda
    </button>

    <button type="button"
            onclick="alinhar('center')"
            title="Centrar">
        <span>≡</span> Centrar
    </button>

    <button type="button"
            onclick="alinhar('right')"
            title="Alinhar à direita">
        <span>☷</span> Direita
    </button>

    <div class="separador"></div>

    <label title="Cor do texto">
        <span>🎨</span> Texto
        <input id="corTexto"
               type="color"
               value="#ffffff">
    </label>

    <label title="Cor do fundo">
        <span>▣</span> Fundo
        <input id="corFundo"
               type="color"
               value="#274956">
    </label>

    <div class="separador"></div>

    <button type="button"
            onclick="limparQuadro()"
            title="Apagar todo o texto">
        <span>🗑️</span> Limpar
    </button>

    <button type="button"
            onclick="alternarEcraInteiro()"
            title="Ecrã inteiro">
        <span>⛶</span> Ecrã inteiro
    </button>

</div>

<script>
    const texto = document.getElementById("texto");
    const corTexto = document.getElementById("corTexto");
    const corFundo = document.getElementById("corFundo");
    const botaoNegrito = document.getElementById("botaoNegrito");

    let tamanhoTexto = 66;
    let negritoAtivo = true;

    function aplicarTamanho() {
        texto.style.fontSize = tamanhoTexto + "px";
        guardarEstado();
    }

    function aumentarTexto() {
        if (tamanhoTexto < 140) {
            tamanhoTexto += 6;
            aplicarTamanho();
        }

        texto.focus();
    }

    function diminuirTexto() {
        if (tamanhoTexto > 24) {
            tamanhoTexto -= 6;
            aplicarTamanho();
        }

        texto.focus();
    }

    function alternarNegrito() {
        negritoAtivo = !negritoAtivo;

        texto.style.fontWeight =
            negritoAtivo ? "700" : "400";

        botaoNegrito.classList.toggle(
            "ativo",
            negritoAtivo
        );

        guardarEstado();
        texto.focus();
    }

    function alinhar(posicao) {
        texto.style.textAlign = posicao;
        guardarEstado();
        texto.focus();
    }

    function limparQuadro() {
        const deveLimpar = confirm(
            "Pretende apagar todo o conteúdo do quadro?"
        );

        if (!deveLimpar) {
            return;
        }

        texto.innerHTML = "";
        guardarEstado();
        texto.focus();
    }

    async function alternarEcraInteiro() {
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (erro) {
            alert("Não foi possível ativar o ecrã inteiro.");
        }
    }

    function guardarEstado() {
        const estado = {
            conteudo: texto.innerHTML,
            tamanho: tamanhoTexto,
            negrito: negritoAtivo,
            alinhamento: texto.style.textAlign || "center",
            corTexto: corTexto.value,
            corFundo: corFundo.value
        };

        localStorage.setItem(
            "quadroFormacaoJoao",
            JSON.stringify(estado)
        );
    }

    function recuperarEstado() {
        const estadoGuardado =
            localStorage.getItem("quadroFormacaoJoao");

        if (!estadoGuardado) {
            texto.innerText = "Olá, vamos começar?";
            botaoNegrito.classList.add("ativo");
            return;
        }

        try {
            const estado = JSON.parse(estadoGuardado);

            texto.innerHTML = estado.conteudo || "";
            tamanhoTexto = estado.tamanho || 66;
            negritoAtivo = estado.negrito !== false;

            texto.style.fontSize = tamanhoTexto + "px";
            texto.style.fontWeight =
                negritoAtivo ? "700" : "400";
            texto.style.textAlign =
                estado.alinhamento || "center";

            corTexto.value =
                estado.corTexto || "#ffffff";
            corFundo.value =
                estado.corFundo || "#274956";

            texto.style.color = corTexto.value;
            document.body.style.backgroundColor =
                corFundo.value;

            botaoNegrito.classList.toggle(
                "ativo",
                negritoAtivo
            );
        } catch (erro) {
            texto.innerText = "Olá, vamos começar?";
        }
    }

    corTexto.addEventListener("input", function () {
        texto.style.color = corTexto.value;
        guardarEstado();
    });

    corFundo.addEventListener("input", function () {
        document.body.style.backgroundColor =
            corFundo.value;

        guardarEstado();
    });

    texto.addEventListener("input", guardarEstado);

    document.querySelector(".ajuda")
        .addEventListener("click", function () {
            alert(
                "Clique no texto central e escreva com o teclado.\n\n" +
                "Utilize a barra inferior para alterar o tamanho, " +
                "o alinhamento, as cores ou ativar o ecrã inteiro."
            );

            texto.focus();
        });

    document.addEventListener("keydown", function (evento) {
        if (evento.key === "F11") {
            return;
        }

        if (evento.key === "Escape") {
            texto.blur();
        }
    });

    recuperarEstado();
</script>

</body>
</html>
